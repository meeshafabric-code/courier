<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --scifi-bg: #03030c;
            --neon-blue: #00f0ff;
            --neon-purple: #bd00ff;
            --laser-gradient: linear-gradient(90deg, transparent, #00f0ff, #bd00ff, transparent);
            --hologram-card: rgba(10, 10, 32, 0.45);
            --hologram-border: rgba(0, 240, 255, 0.18);
            
            --neon-red: #ff0055;
            --neon-orange: #ffaa00;
            --neon-green: #00ff66;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--scifi-bg);
            min-height: 100vh;
            color: #e2e8f0;
            padding-bottom: 140px;
            font-weight: 600;
            letter-spacing: 0.5px;
            overflow-x: hidden;
            font-size: 16px;
            position: relative;
        }

        /* --- ADVANCED ANIMATED MATRIX BACKGROUND --- */
        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%; right: -50%; bottom: -50%;
            background-image: 
                radial-gradient(rgba(0, 240, 255, 0.08) 1px, transparent 0),
                linear-gradient(rgba(189, 0, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px, 30px 30px;
            z-index: -1;
            animation: backgroundShift 60s linear infinite;
        }

        @keyframes backgroundShift {
            0% { transform: rotate(0deg) translateY(0px); }
            50% { transform: rotate(2deg) translateY(-50px); }
            100% { transform: rotate(0deg) translateY(0px); }
        }

        .scifi-container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
        }

        /* --- GLOWING NEON HEADER --- */
        .scifi-header {
            padding: 35px 20px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .scifi-brand h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #fff 30%, var(--neon-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGlow 3s infinite ease-in-out;
        }
        .scifi-brand p {
            font-size: 13px;
            color: var(--neon-purple);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 4px;
            text-shadow: 0 0 10px rgba(189, 0, 255, 0.5);
        }

        @keyframes textGlow {
            0%, 100% { filter: drop-shadow(0 0 4px rgba(0, 240, 255, 0.3)); }
            50% { filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.8)) drop-shadow(0 0 20px rgba(189, 0, 255, 0.5)); }
        }

        .scifi-login-btn {
            font-family: 'Orbitron', sans-serif;
            background: rgba(189, 0, 255, 0.08);
            border: 1px solid var(--neon-purple);
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            text-shadow: 0 0 8px var(--neon-purple);
            box-shadow: 0 0 15px rgba(189, 0, 255, 0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .scifi-login-btn:hover { 
            background: var(--neon-purple);
            box-shadow: 0 0 25px rgba(189, 0, 255, 0.6);
            transform: translateY(-2px);
        }
        .scifi-login-btn.unlocked {
            border-color: var(--neon-green);
            color: var(--neon-green);
            text-shadow: 0 0 8px var(--neon-green);
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
            background: rgba(0, 255, 102, 0.05);
        }

        /* --- GLASSMORPHISM METRICS & PROGRESS BAR --- */
        .scifi-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 0 20px;
            margin-bottom: 15px;
        }
        .metric-box {
            background: var(--hologram-card);
            border: 1px solid var(--hologram-border);
            padding: 20px 10px;
            border-radius: 16px;
            text-align: center;
            position: relative;
            backdrop-filter: blur(15px);
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.08);
            transition: all 0.3s ease;
        }
        .metric-box span { 
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 700; 
            color: #fff; 
            display: block; 
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        .metric-box label { font-size: 13px; color: #94a3b8; text-transform: uppercase; font-weight: 700; letter-spacing: 1px;}
        .metric-box.m-transit span { color: var(--neon-orange); text-shadow: 0 0 10px var(--neon-orange); }
        .metric-box.m-delivered span { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }

        /* ADVANCED HOLOGRAPHIC PROGRESS BAR */
        .analytics-progress-container { margin: 0 20px 25px; padding: 12px 18px; background: rgba(5,5,15,0.6); border: 1px solid rgba(0,240,255,0.1); border-radius: 12px; }
        .progress-labels { display: flex; justify-content: space-between; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; text-transform: uppercase; font-family: 'Orbitron', sans-serif; }
        .progress-track { width: 100%; height: 8px; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden; position: relative; }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--neon-orange), var(--neon-green)); box-shadow: 0 0 10px var(--neon-green); transition: width 0.6s ease-in-out; }

        /* --- INPUT CONTROLS SYSTEM --- */
        .scifi-controls { padding: 0 20px; margin-bottom: 30px; }
        .controls-flex { display: flex; flex-direction: column; gap: 15px; }
        .search-bar-wrapper { position: relative; flex: 1; }
        
        .search-bar-wrapper input {
            width: 100%;
            padding: 18px 18px 18px 52px;
            background: rgba(4, 4, 16, 0.65);
            border: 1px solid var(--hologram-border);
            border-radius: 16px;
            color: #fff;
            font-size: 16px;
            outline: none;
            font-family: inherit;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        .search-bar-wrapper input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.35);
        }
        .search-bar-wrapper .search-icon {
            position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--neon-blue); font-size: 18px;
        }

        .scifi-tabs { display: flex; gap: 10px; flex: 1; }
        .tab-btn {
            flex: 1; padding: 16px; background: rgba(255,255,255,0.02); border: 1px solid var(--hologram-border);
            color: #94a3b8; font-family: inherit; font-size: 15px; font-weight: 700; border-radius: 12px; cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.25) 0%, rgba(189, 0, 255, 0.25) 100%);
            color: #fff; border-color: var(--neon-blue); box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        /* ADVANCED FILTER DRAWER TOGGLE BTN */
        .adv-filter-toggle { width: 100%; background: rgba(189,0,255,0.05); border: 1px dashed rgba(189,0,255,0.3); color: #cbd5e1; padding: 10px; border-radius: 10px; font-family: inherit; cursor: pointer; font-size: 14px; text-transform: uppercase; transition: all 0.2s; }
        .adv-filter-toggle:hover { background: rgba(189,0,255,0.12); color: #fff; }
        .filter-drawer { display: none; background: rgba(5,5,15,0.8); border: 1px solid rgba(0,240,255,0.15); padding: 15px; border-radius: 12px; margin-top: 10px; gap: 12px; grid-template-columns: 1fr; }
        .filter-drawer.open { display: grid; }

        /* --- HIGH-TECH HOLOGRAPHIC PULSING CARDS --- */
        .cards-container { padding: 0 20px; display: grid; grid-template-columns: 1fr; gap: 20px; }
        
        .scifi-card {
            background: var(--hologram-card); 
            border: 1px solid var(--hologram-border); 
            border-radius: 20px; 
            padding: 24px; 
            position: relative; 
            overflow: hidden;
            backdrop-filter: blur(16px);
            display: flex; flex-direction: column; justify-content: space-between;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        /* CARD LIVE NEON PULSE EFFECTS */
        .scifi-card.border-pending { border-color: var(--neon-red); animation: pulseRed 3s infinite ease-in-out; }
        .scifi-card.border-transit { border-color: var(--neon-orange); animation: pulseOrange 3s infinite ease-in-out; }
        .scifi-card.border-delivered { border-color: var(--neon-green); animation: pulseGreen 3s infinite ease-in-out; }

        @keyframes pulseRed { 0%, 100% { box-shadow: 0 5px 15px rgba(0,0,0,0.4), inset 0 0 5px rgba(255,0,85,0.1); } 50% { box-shadow: 0 5px 25px rgba(255,0,85,0.15), inset 0 0 12px rgba(255,0,85,0.1); } }
        @keyframes pulseOrange { 0%, 100% { box-shadow: 0 5px 15px rgba(0,0,0,0.4), inset 0 0 5px rgba(255,170,0,0.1); } 50% { box-shadow: 0 5px 25px rgba(255,170,0,0.15), inset 0 0 12px rgba(255,170,0,0.1); } }
        @keyframes pulseGreen { 0%, 100% { box-shadow: 0 5px 15px rgba(0,0,0,0.4), inset 0 0 5px rgba(0,255,102,0.1); } 50% { box-shadow: 0 5px 25px rgba(0,255,102,0.15), inset 0 0 12px rgba(0,255,102,0.1); } }

        .status-pill-tag { position: absolute; top: 24px; right: 24px; padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .tag-pending { background: rgba(255, 0, 85, 0.15); color: var(--neon-red); }
        .tag-transit { background: rgba(255, 170, 0, 0.15); color: var(--neon-orange); }
        .tag-delivered { background: rgba(0, 255, 102, 0.15); color: var(--neon-green); }

        .party-details { display: flex; flex-direction: column; max-width: 65%; }
        .party-details h2 { font-size: 24px; font-weight: 700; color: #fff; line-height: 1.2; letter-spacing: 0.5px; }
        .city-tag { display: inline-block; background: rgba(0, 240, 255, 0.08); padding: 5px 12px; border-radius: 8px; margin-top: 10px; font-size: 14px; color: var(--neon-blue); border: 1px solid rgba(0, 240, 255, 0.2); font-weight: 700; width: fit-content; }

        .info-grid-matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; border-top: 1px dashed rgba(0, 240, 255, 0.15); padding-top: 18px; margin-bottom: 18px; margin-top: 18px; }
        .grid-cell { display: flex; flex-direction: column; gap: 3px; position: relative; }
        .grid-cell label { font-size: 12px; color: #52647c; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
        .grid-cell span { font-size: 17px; color: #cbd5e1; font-weight: 600; word-break: break-all; }

        /* INTERACTION MICRO ICONS (COPY & WHATSAPP) */
        .interactive-icon { margin-left: 6px; cursor: pointer; font-size: 14px; display: inline-block; transition: transform 0.2s; }
        .interactive-icon:hover { transform: scale(1.2); }
        .wa-share-btn { position: absolute; right: 24px; top: 65px; background: rgba(0,255,102,0.1); border: 1px solid rgba(0,255,102,0.3); color: var(--neon-green); padding: 8px; border-radius: 50%; font-size: 16px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .wa-share-btn:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 12px var(--neon-green); }

        /* --- CARD ACTION BUTTONS ROW SYSTEM --- */
        .card-bottom-actions { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            background: rgba(1, 1, 5, 0.6); 
            padding: 12px; 
            border-radius: 12px; 
            border: 1px solid rgba(0, 240, 255, 0.15); 
        }
        .status-dropdown { 
            background: #070714; 
            border: 1px solid rgba(255,255,255,0.05); 
            color: #cbd5e1; 
            font-size: 15px; 
            font-weight: 700; 
            outline: none; 
            width: 100%; 
            font-family: inherit; 
            cursor: pointer; 
            padding: 10px; 
            border-radius: 8px; 
        }
        .buttons-cluster { 
            display: flex; 
            gap: 8px; 
            width: 100%; 
            justify-content: flex-start;
            flex-wrap: wrap;
        }
        .scifi-btn { 
            height: 38px; 
            flex: 1;
            min-width: 75px;
            padding: 0 10px; 
            border-radius: 8px; 
            font-size: 13px; 
            font-weight: 700; 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #fff; 
            background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(0, 240, 255, 0.2); 
            font-family: inherit; 
            transition: all 0.2s; 
            white-space: nowrap;
        }
        .scifi-btn:hover { background: rgba(0, 240, 255, 0.15); border-color: var(--neon-blue); box-shadow: 0 0 12px rgba(0, 240, 255, 0.3); }
        .btn-delete { color: var(--neon-red); border-color: rgba(255, 0, 85, 0.35); background: rgba(255, 0, 85, 0.04); cursor: pointer; }
        .btn-delete:hover { background: var(--neon-red); color: #fff; box-shadow: 0 0 15px rgba(255, 0, 85, 0.5); }

        /* SCI-FI SCREEN ALERTS (TOAST) */
        .scifi-toast { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%) translateY(30px); background: #050515; border: 1px solid var(--neon-blue); padding: 12px 24px; border-radius: 8px; color: #fff; font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: bold; box-shadow: 0 0 20px rgba(0,240,255,0.4); opacity: 0; visibility: hidden; transition: all 0.3s ease; z-index: 500; letter-spacing: 1px; }
        .scifi-toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

        /* --- POPUP WINDOWS --- */
        .scifi-modal-layer {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(1, 1, 4, 0.96); backdrop-filter: blur(20px); z-index: 250;
            display: flex; align-items: center; justify-content: center;
            visibility: hidden; opacity: 0; transition: all 0.4s;
        }
        .scifi-modal-layer.active { visibility: visible; opacity: 1; }

        .scifi-form-box {
            width: 100%; height: 100%; max-height: 100vh; background: #04040d;
            padding: 25px 20px 120px 20px; overflow-y: auto; overflow-x: hidden;
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .scifi-modal-layer.active .scifi-form-box { transform: translateY(0); }
        
        .form-top-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 12px; border-bottom: 1px solid rgba(0, 240, 255, 0.2); }
        .form-top-title h2 { font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 900; color: #fff; text-shadow: 0 0 10px var(--neon-blue); }
        .form-close-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,0,85,0.3); color: var(--neon-red); font-size: 20px; padding: 6px 14px; border-radius: 10px; cursor: pointer; font-weight: bold; }

        .login-terminal-box {
            width: calc(100% - 30px); max-width: 400px; background: #050510; border: 1px solid var(--neon-purple); border-radius: 24px; padding: 35px; text-align: center;
        }
        
        .terminal-header h3 { font-family: 'Orbitron', sans-serif; font-size: 22px; color: #fff; text-shadow: 0 0 10px rgba(189,0,255,0.4); }
        .terminal-header p { font-size: 14px; color: #64748b; margin-top: 6px; }
        
        .passkey-field-wrapper { position: relative; margin-bottom: 26px; margin-top: 20px; }
        .passkey-field-wrapper input {
            width: 100%; padding: 18px; background: rgba(0,0,0,0.6); border: 1px solid rgba(189, 0, 255, 0.4); border-radius: 14px;
            color: #fff; text-align: center; font-size: 20px; font-family: 'Orbitron', sans-serif; letter-spacing: 6px; outline: none;
        }
        
        .terminal-actions { display: flex; gap: 14px; }
        .term-btn { flex: 1; padding: 16px; border-radius: 12px; font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; border: none; }
        .btn-auth { background: linear-gradient(90deg, #bd00ff, #00f0ff); color: #fff; }
        .btn-cancel { background: rgba(255,255,255,0.02); color: #64748b; border: 1px solid rgba(255,255,255,0.06); }

        /* --- STACK FORM LAYOUT BUILD --- */
        .form-grid-stack { display: flex; flex-direction: column; gap: 18px; }
        .input-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .input-group { display: flex; flex-direction: column; gap: 6px; width: 100%; }
        .input-group label { font-size: 14px; color: var(--neon-blue); text-transform: uppercase; font-weight: 700; }
        .input-group input, .input-group select {
            width: 100%; background: rgba(10, 10, 25, 0.8); border: 1px solid var(--hologram-border); padding: 15px 12px; border-radius: 12px; color: #fff; font-size: 16px; outline: none; font-family: inherit;
        }
        
        .submit-laser-btn {
            font-family: 'Orbitron', sans-serif; background: linear-gradient(90deg, #00f0ff, #bd00ff); color: #fff; padding: 18px; border: none; border-radius: 14px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 15px; box-shadow: 0 5px 25px rgba(0, 240, 255, 0.4); text-transform: uppercase; width: 100%;
        }

        /* --- FLOATING PREMIUM DOCK PANEL --- */
        .scifi-bottom-dock {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 620px; height: 76px; 
            background: rgba(6, 6, 20, 0.7); backdrop-filter: blur(30px); border: 1px solid rgba(0, 240, 255, 0.25); border-radius: 20px; 
            display: flex; justify-content: space-around; align-items: center; z-index: 150; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.7), inset 0 0 15px rgba(0, 240, 255, 0.1);
        }
        .dock-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; color: #64748b; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; gap: 4px; }
        .dock-btn.active { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }
        .dock-icon { font-size: 18px; }
        
        .center-add-btn { 
            width: 60px; height: 60px; background: linear-gradient(135deg, #00f0ff 0%, #bd00ff 100%); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; color: #fff; font-size: 28px; border: none; 
            transform: translateY(-16px); box-shadow: 0 8px 25px rgba(0, 240, 255, 0.5); cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        .hidden { display: none; }

        /* Responsive refinements for Desktop screen styling */
        @media screen and (min-width: 768px) {
            .card-bottom-actions { flex-direction: row; justify-content: space-between; align-items: center; }
            .status-dropdown { max-width: 180px; }
            .buttons-cluster { width: auto; justify-content: flex-end; }
            .scifi-modal-layer { padding: 20px; }
            .scifi-form-box { height: auto; max-height: 90vh; border-radius: 24px; border: 1px solid var(--neon-blue); padding: 30px; }
            .scifi-modal-layer.active .scifi-form-box { transform: translateY(0) scale(1); }
            .controls-flex { flex-direction: row; align-items: center; }
            .cards-container { grid-template-columns: repeat(2, 1fr); gap: 24px; }
            .scifi-brand h1 { font-size: 34px; }
            .metric-box { padding: 24px 15px; }
            .filter-drawer { grid-template-columns: repeat(3, 1fr); }
        }

        @media screen and (min-width: 1150px) {
            .cards-container { grid-template-columns: repeat(3, 1fr); gap: 28px; }
            .scifi-header, .scifi-metrics, .scifi-controls, .cards-container, .analytics-progress-container { padding-left: 0; padding-right: 0; }
        }
    </style>
</head>
<body onload='init()'>

    <div class="scifi-container">
        <div class='scifi-header'>
            <div class='scifi-brand'>
                <h1>MEESHA FABRICS</h1>
                <p>🛰️ LIVE DISPATCH HUB</p>
            </div>
            <button id='lockBtn' class='scifi-login-btn' onclick='openLoginTerminal()'>🔑 ADMIN LOCK</button>
        </div>

        <div class='scifi-metrics'>
            <div class='metric-box'>
                <span id='countTotal'>-</span>
                <label>Total Sent</label>
            </div>
            <div class='metric-box m-transit'>
                <span id='countPending'>-</span>
                <label>On Way</label>
            </div>
            <div class='metric-box m-delivered'>
                <span id='countDelivered'>-</span>
                <label>Delivered</label>
            </div>
        </div>

        <div class="analytics-progress-container">
            <div class="progress-labels">
                <span>Delivery Efficiency Status</span>
                <span id="efficiencyPercent">0% Completed</span>
            </div>
            <div class="progress-track">
                <div class="progress-bar-fill" id="efficiencyBar"></div>
            </div>
        </div>

        <div class='scifi-controls'>
            <div class="controls-flex">
                <div class='search-bar-wrapper'>
                    <span class='search-icon'>🔍</span>
                    <input type='text' id='query' oninput='liveSearch()' placeholder='Search Party name, City or LR No...'>
                </div>
                
                <div class='scifi-tabs'>
                    <button class='tab-btn active' id='seg-all' onclick="filterSegment('all')">All Entries</button>
                    <button class='tab-trigger tab-btn' id='seg-courier' onclick="filterSegment('courier')">Courier</button>
                    <button class='tab-trigger tab-btn' id='seg-transport' onclick="filterSegment('transport')">Transport</button>
                </div>
            </div>

            <button class="adv-filter-toggle" style="margin-top:15px;" onclick="document.getElementById('advFilterDrawer').classList.toggle('open')">⚡ Advance Filter Panel (Date / Service)</button>
            <div class="filter-drawer" id="advFilterDrawer">
                <div class="input-group">
                    <label style="font-size:11px;">From Date</label>
                    <input type="date" id="filterStartDate" onchange="liveSearch()" style="padding:8px; font-size:14px;">
                </div>
                <div class="input-group">
                    <label style="font-size:11px;">To Date</label>
                    <input type="date" id="filterEndDate" onchange="liveSearch()" style="padding:8px; font-size:14px;">
                </div>
                <div class="input-group">
                    <label style="font-size:11px;">Select Carrier Agency</label>
                    <select id="filterAgency" onchange="liveSearch()" style="padding:8px; font-size:14px;">
                        <option value="">-- All Courier/Gadi --</option>
                        <option value="Shree Mahavir">Shree Mahavir</option>
                        <option value="ST-Courier">ST-Courier</option>
                        <option value="Delhivery">Delhivery</option>
                        <option value="Bluedart">Bluedart</option>
                        <option value="DTDC">DTDC</option>
                        <option value="Skyking">Skyking</option>
                    </select>
                </div>
            </div>
        </div>

        <div class='cards-container' id='mobBody'>
            </div>
    </div>

    <div class="scifi-toast" id="scifiToast">SYSTEM CALIBRATED</div>

    <div id='loginOverlay' class='scifi-modal-layer'>
        <div class='login-terminal-box'>
            <div class='terminal-header'>
                <h3>SECURITY AUTH</h3>
                <p>Enter System Passkey to Access Admin Panel</p>
            </div>
            <div class='passkey-field-wrapper'>
                <input type='password' id='passkeyInput' placeholder='•••••'>
            </div>
            <div class='terminal-actions'>
                <button class='term-btn btn-cancel' onclick='closeLoginTerminal()'>CANCEL</button>
                <button class='term-btn btn-auth' onclick='verifyAdminPasskey()'>VERIFY</button>
            </div>
        </div>
    </div>

    <div id='sheetOverlay' class='scifi-modal-layer' onclick='closeSheetOnOuterClick(event)'>
        <div class='scifi-form-box'>
            <div class='form-top-title'>
                <h2>NEW DISPATCH ENTRY</h2>
                <button class='form-close-btn' onclick='toggleSheet(false)'>✕ CLOSE</button>
            </div>
            
            <div class='form-grid-stack'>
                <div class='input-group'>
                    <label>Party / Client Name</label>
                    <input type='text' id='party' placeholder='Enter Firm Name'>
                </div>
                
                <div class='input-row-2'>
                    <div class='input-group'><label>Mobile No.</label><input type='text' id='mobile' placeholder='10 digit number'></div>
                    <div class='input-group'><label>City Name</label><input type='text' id='city' placeholder='e.g. Delhi'></div>
                </div>
                
                <div class='input-row-2'>
                    <div class='input-group'>
                        <label>Transport Mode</label>
                        <select id='mode' onchange='toggleFormMode()'>
                            <option value='courier'>📦 Courier</option>
                            <option value='transport'>Local Gadi / Transport</option>
                        </select>
                    </div>
                    <div class='input-group' id='cBox'>
                        <label>Courier Name</label>
                        <select id='cVal'>
                            <option value="Shree Mahavir">Shree Mahavir</option>
                            <option value="ST-Courier">ST-Courier</option>
                            <option value="Delhivery">Delhivery</option>
                            <option value="Bluedart">Bluedart</option>
                            <option value="DTDC">DTDC</option>
                            <option value="Skyking">Skyking</option>
                            <option value="Akashganga">Akashganga</option>
                            <option value="Trackon">Trackon</option>
                        </select>
                    </div>
                    <div class='input-group hidden' id='tBox'>
                        <label>Gadi / Transport Name</label>
                        <input type='text' id='tVal' placeholder='e.g. VRL Logistics'>
                    </div>
                </div>
                
                <div class='input-row-2'>
                    <div class='input-group'><label>LR / Tracking No.</label><input type='text' id='lr' placeholder='Enter LR Number'></div>
                    <div class='input-group'><label>Total Weight (KG)</label><input type='number' id='wt' placeholder='Weight'></div>
                </div>
                
                <div class='input-row-2'>
                    <div class='input-group'><label>Sending Date</label><input type='date' id='date'></div>
                    <div class='input-group'>
                        <label>Current Status</label>
                        <select id='status'>
                            <option value='Pending'>⏳ Pending</option>
                            <option value='In Transit' selected>🚚 In Transit</option>
                            <option value='Delivered'>✅ Delivered</option>
                        </select>
                    </div>
                </div>
                
                <div class='input-group'>
                    <label>Upload Bill / Receipt Photo</label>
                    <input type='file' id='fileIn' style="padding: 10px;">
                </div>
                <button class='submit-laser-btn' id='sBtn' onclick='saveData()'>SAVE ENTRY TO SYSTEM</button>
            </div>
        </div>
    </div>

    <div class='scifi-bottom-dock'>
        <button class='dock-btn active' id='dock-all' onclick="filterSegment('all')">
            <span class='dock-icon'>📊</span><span>Home Console</span>
        </button>
        <button class='dock-btn' id='dock-pending' onclick="filterSegment('pending')">
            <span class='dock-icon'>🚚</span><span>On Way</span>
        </button>
        
        <button class='center-add-btn' onclick='handleAddAction()'>+</button>
        
        <button class='dock-btn' id='dock-delivered' onclick="filterSegment('delivered')">
            <span class='dock-icon'>✅</span><span>Delivered</span>
        </button>
        <button class='dock-btn' onclick='window.scrollTo({top: 0, behavior: "smooth"})'>
            <span class='dock-icon'>▲</span><span>Top</span>
        </button>
    </div>

    <script>
        let masterData = [];
        let currentTab = 'all';
        let isAdmin = false;

        // SECURE DEPLOYMENT ENDPOINT ROUTER
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxVeOVwQIeqpP9HQfhgVY2UMiBAgM0yghjnDY9vpN-tlhpoPqTBN0-eXvM1ojLGWOaW/exec";

        const tracker = {
            "shree mahavir": "https://www.shreemahavircourier.com/",
            "st-courier": "https://stcourier.com/track/shipment",
            "delhivery": "https://www.delhivery.com/track/package/",
            "bluedart": "https://www.bluedart.com/tracking",
            "dtdc": "https://www.dtdc.in/tracking/tracking_results.asp",
            "skyking": "https://skyking.co/track",
            "trackon": "https://www.trackon.in/courier-tracking",
        };

        function showSciFiToast(msg) {
            let toast = document.getElementById('scifiToast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showSciFiToast("📋 COPIED TO CLIPBOARD: " + text);
            });
        }

        function shareOnWhatsApp(party, mobile, lr, service, status) {
            if(!mobile || mobile === '-') { alert("No valid mobile number saved for this client."); return; }
            let cleanedMob = mobile.replace(/\D/g,'');
            if(cleanedMob.length === 10) cleanedMob = "91" + cleanedMob;
            
            let txt = `Hello *${party}*,\n\nYour dispatch parcel has been processed via *${service}*.\n📦 *LR/Tracking No:* ${lr}\n⚡ *Current Status:* ${status}\n\nThank you,\n*Meesha Fabrics*`;
            let encodedText = encodeURIComponent(txt);
            window.open(`https://api.whatsapp.com/send?phone=${cleanedMob}&text=${encodedText}`, '_blank');
        }

        function openLoginTerminal() {
            if (isAdmin) {
                isAdmin = false;
                document.getElementById('lockBtn').classList.remove('unlocked');
                document.getElementById('lockBtn').innerText = "🔑 ADMIN LOCK";
                showSciFiToast("🔒 ADMIN SESSION TERMINATED");
                renderCards(masterData);
                return;
            }
            document.getElementById('loginOverlay').classList.add('active');
            document.getElementById('passkeyInput').focus();
        }

        function closeLoginTerminal() {
            document.getElementById('loginOverlay').classList.remove('active');
            document.getElementById('passkeyInput').value = "";
        }

        function verifyAdminPasskey() {
            let pass = document.getElementById('passkeyInput').value;
            if (pass === "12345") { // Change your admin password here if needed
                isAdmin = true;
                document.getElementById('lockBtn').classList.add('unlocked');
                document.getElementById('lockBtn').innerText = "🔓 ADMIN UNLOCKED";
                showSciFiToast("🔓 ACCESS GRANTED: WELCOME ADMIN");
                closeLoginTerminal();
                renderCards(masterData);
            } else {
                showSciFiToast("🚨 ACCESS DENIED: INVALID KEY");
            }
        }

        function handleAddAction() {
            if (!isAdmin) {
                showSciFiToast("🔒 ACTION BLOCKED: AUTHENTICATE ADMIN FIRST");
                openLoginTerminal();
                return;
            }
            toggleSheet(true);
        }

        function toggleSheet(show) {
            let formLayer = document.getElementById('sheetOverlay');
            if(show) {
                formLayer.classList.add('active');
                document.getElementById('date').valueAsDate = new Date();
            } else {
                formLayer.classList.remove('active');
                clearFormFields();
            }
        }

        function closeSheetOnOuterClick(e) {
            if(e.target.id === 'sheetOverlay') {
                toggleSheet(false);
            }
        }

        function toggleFormMode() {
            let m = document.getElementById('mode').value;
            if (m === 'courier') {
                document.getElementById('cBox').classList.remove('hidden');
                document.getElementById('tBox').classList.add('hidden');
            } else {
                document.getElementById('cBox').classList.add('hidden');
                document.getElementById('tBox').classList.remove('hidden');
            }
        }

        function clearFormFields() {
            document.getElementById('party').value = "";
            document.getElementById('mobile').value = "";
            document.getElementById('city').value = "";
            document.getElementById('lr').value = "";
            document.getElementById('wt').value = "";
            document.getElementById('tVal').value = "";
            document.getElementById('fileIn').value = "";
        }

        function init() {
            showSciFiToast("📡 CONSOLE INIT: FETCHING DATA...");
            fetchData();
        }

        // HIGH SPEED API ENGINE FOR LOADING DATA
        function fetchData() {
            fetch(`${WEB_APP_URL}?action=getData`)
            .then(res => res.json())
            .then(data => {
                masterData = data;
                calculateMetrics(masterData);
                renderCards(masterData);
                showSciFiToast("📡 CORE NETWORK ACCESS COMPLETED");
            })
            .catch(err => {
                showSciFiToast("🚨 SYNC ERROR: FETCH FAILED");
                console.error(err);
            });
        }

        function calculateMetrics(data) {
            let total = data.length;
            let pending = data.filter(r => r.status === 'In Transit' || r.status === 'Pending').length;
            let delivered = data.filter(r => r.status === 'Delivered').length;

            document.getElementById('countTotal').innerText = total;
            document.getElementById('countPending').innerText = pending;
            document.getElementById('countDelivered').innerText = delivered;

            let percentage = total > 0 ? Math.round((delivered / total) * 100) : 0;
            document.getElementById('efficiencyPercent').innerText = percentage + "% Completed";
            document.getElementById('efficiencyBar').style.width = percentage + "%";
        }

        function renderCards(data) {
            let container = document.getElementById('mobBody');
            container.innerHTML = "";

            if (data.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:40px; color:#52647c; font-family:'Orbitron'; font-size:14px; grid-column: 1/-1;">NO ACTIVE RECORDS DETECTED IN NODE</div>`;
                return;
            }

            data.forEach(item => {
                let cardClass = "border-pending";
                let tagClass = "tag-pending";
                if(item.status === 'In Transit') { cardClass = "border-transit"; tagClass = "tag-transit"; }
                if(item.status === 'Delivered') { cardClass = "border-delivered"; tagClass = "tag-delivered"; }

                let serviceDisplay = item.mode === 'courier' ? item.service : item.service;
                
                let trackLinkHTML = "";
                let serviceLower = item.service ? item.service.toLowerCase().trim() : "";
                if(tracker[serviceLower] && item.lr && item.lr !== '-') {
                    let finalUrl = tracker[serviceLower];
                    if(serviceLower === 'delhivery') finalUrl += item.lr;
                    trackLinkHTML = `<a href="${finalUrl}" target="_blank" class="scifi-btn" style="border-color:var(--neon-blue); color:var(--neon-blue);">🛰️ TRACK</a>`;
                }

                let receiptHTML = `<button class="scifi-btn" style="opacity:0.3; cursor:not-allowed;">🖼️ NO BILL</button>`;
                if(item.receipt && item.receipt !== 'No File') {
                    receiptHTML = `<a href="${item.receipt}" target="_blank" class="scifi-btn" style="border-color:var(--neon-purple); color:#fff; text-shadow:0 0 5px var(--neon-purple);">🖼️ VIEW BILL</a>`;
                }

                let adminActionsHTML = "";
                if (isAdmin) {
                    adminActionsHTML = `
                        <div class="card-bottom-actions">
                            <select class="status-dropdown" onchange="updateRecordStatus('${item.id}', this.value)">
                                <option value="Pending" ${item.status === 'Pending' ? 'selected' : ''}>⏳ Pending</option>
                                <option value="In Transit" ${item.status === 'In Transit' ? 'selected' : ''}>🚚 In Transit</option>
                                <option value="Delivered" ${item.status === 'Delivered' ? 'selected' : ''}>✅ Delivered</option>
                            </select>
                            <div class="buttons-cluster">
                                <button class="scifi-btn btn-delete" onclick="deleteRecord('${item.id}')">🗑️ PURGE</button>
                            </div>
                        </div>`;
                }

                let cardHTML = `
                    <div class="scifi-card ${cardClass}">
                        <div class="status-pill-tag ${tagClass}">${item.status}</div>
                        <button class="wa-share-btn" onclick="shareOnWhatsApp('${item.party}','${item.mobile}','${item.lr}','${serviceDisplay}','${item.status}')">💬</button>
                        
                        <div class="party-details">
                            <h2>${item.party}</h2>
                            <div class="city-tag">📍 ${item.city}</div>
                        </div>

                        <div class="info-grid-matrix">
                            <div class="grid-cell">
                                <label>Date</label>
                                <span>${item.date}</span>
                            </div>
                            <div class="grid-cell">
                                <label>Carrier Mode</label>
                                <span>${serviceDisplay}</span>
                            </div>
                            <div class="grid-cell">
                                <label>LR / Tracking ID</label>
                                <span>${item.lr || '-'} <i class="interactive-icon" onclick="copyToClipboard('${item.lr}')">📋</i></span>
                            </div>
                            <div class="grid-cell">
                                <label>Weight Load</label>
                                <span>${item.weight ? item.weight + ' KG' : '-'}</span>
                            </div>
                        </div>

                        <div class="buttons-cluster" style="margin-bottom:${isAdmin ? '15px' : '0px'};">
                            ${receiptHTML}
                            ${trackLinkHTML}
                        </div>
                        
                        ${adminActionsHTML}
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function filterSegment(seg) {
            currentTab = seg;
            let docTabs = ['dock-all', 'dock-pending', 'dock-delivered', 'seg-all', 'seg-courier', 'seg-transport'];
            docTabs.forEach(t => { if(document.getElementById(t)) document.getElementById(t).classList.remove('active'); });

            if(seg === 'all') { document.getElementById('dock-all').classList.add('active'); document.getElementById('seg-all').classList.add('active'); }
            if(seg === 'pending') document.getElementById('dock-pending').classList.add('active');
            if(seg === 'delivered') document.getElementById('dock-delivered').classList.add('active');
            if(seg === 'courier') document.getElementById('seg-courier').classList.add('active');
            if(seg === 'transport') document.getElementById('seg-transport').classList.add('active');

            liveSearch();
        }

        function liveSearch() {
            let q = document.getElementById('query').value.toLowerCase();
            let startF = document.getElementById('filterStartDate').value;
            let endF = document.getElementById('filterEndDate').value;
            let agencyF = document.getElementById('filterAgency').value.toLowerCase();

            let startTimestamp = startF ? new Date(startF).getTime() : null;
            let endTimestamp = endF ? new Date(endF).getTime() + 86399999 : null; 

            let filtered = masterData.filter(item => {
                let matchQuery = item.party.toLowerCase().includes(q) || item.city.toLowerCase().includes(q) || item.lr.toLowerCase().includes(q);
                
                let matchTab = true;
                if (currentTab === 'pending') matchTab = (item.status === 'In Transit' || item.status === 'Pending');
                if (currentTab === 'delivered') matchTab = (item.status === 'Delivered');
                if (currentTab === 'courier') matchTab = (item.mode === 'courier');
                if (currentTab === 'transport') matchTab = (item.mode === 'transport');

                let matchDate = true;
                if(startTimestamp && item.rawDate < startTimestamp) matchDate = false;
                if(endTimestamp && item.rawDate > endTimestamp) matchDate = false;

                let matchAgency = true;
                if(agencyF && (!item.service || !item.service.toLowerCase().includes(agencyF))) matchAgency = false;

                return matchQuery && matchTab && matchDate && matchAgency;
            });

            renderCards(filtered);
        }

        // HIGH SPEED API ENGINE FOR WRITING RECORDS
        function saveData() {
            let party = document.getElementById('party').value;
            let mobile = document.getElementById('mobile').value;
            let city = document.getElementById('city').value;
            let mode = document.getElementById('mode').value;
            let service = mode === 'courier' ? document.getElementById('cVal').value : document.getElementById('tVal').value;
            let lr = document.getElementById('lr').value;
            let wt = document.getElementById('wt').value;
            let dateVal = document.getElementById('date').value;
            let status = document.getElementById('status').value;
            let fileInput = document.getElementById('fileIn');

            if (!party || !city || !service || !lr) {
                alert("CRITICAL ERROR: Mandatory fields missing.");
                return;
            }

            document.getElementById('sBtn').innerText = "⚡ COMMITTING ENCRYPTION TRANSACTION...";
            document.getElementById('sBtn').disabled = true;

            let finalDate = dateVal ? UtilitiesFormatDateFix(dateVal) : "";

            let payload = {
                action: "save",
                data: {
                    date: finalDate, party: party, mobile: mobile, city: city,
                    service: service, lr: lr, weight: wt, mode: mode, status: status
                },
                fileData: null
            };

            if (fileInput.files.length > 0) {
                let file = fileInput.files[0];
                let reader = new FileReader();
                reader.onload = function(e) {
                    payload.fileData = {
                        content: e.target.result,
                        name: file.name
                    };
                    executePostRequest(payload);
                };
                reader.readAsDataURL(file);
            } else {
                executePostRequest(payload);
            }
        }

        function UtilitiesFormatDateFix(str) {
            let parts = str.split('-');
            if(parts.length === 3) return parts[2] + "-" + parts[1] + "-" + parts[0]; 
            return str;
        }

        function executePostRequest(payload) {
            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                if(res.status === "SUCCESS") {
                    showSciFiToast("✅ BLOCK CHAIN TRANSACTION COMPLETE");
                    toggleSheet(false);
                    fetchData();
                } else {
                    showSciFiToast("🚨 TRANSACTION REJECTED");
                }
                resetSaveButton();
            })
            .catch(err => {
                showSciFiToast("🚨 NETWORK PIPELINE ERROR");
                console.error(err);
                resetSaveButton();
            });
        }

        function resetSaveButton() {
            document.getElementById('sBtn').innerText = "SAVE ENTRY TO SYSTEM";
            document.getElementById('sBtn').disabled = false;
        }

        // HIGH SPEED API ENGINE FOR RE-CALIBRATING STATUS
        function updateRecordStatus(id, newStatus) {
            showSciFiToast("⚡ INITIATING STATUS OVERRIDE...");
            let payload = { action: "update", id: id, status: newStatus };
            
            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                if(res.status === "SUCCESS") {
                    showSciFiToast("✅ STATUS SYNC OVERRIDE COMPLETED");
                    fetchData();
                } else {
                    showSciFiToast("🚨 OVERRIDE FAILED");
                }
            });
        }

        // HIGH SPEED API ENGINE FOR RECORD PURGING
        function deleteRecord(id) {
            if(!confirm("⚠️ WARNING: Are you sure you want to permanently delete this record?")) return;
            showSciFiToast("⚡ EXECUTING DELETION INJECTOR...");
            let payload = { action: "delete", id: id };

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                if(res.status === "SUCCESS") {
                    showSciFiToast("🗑️ RECORD SUCESSFULLY PURGED FROM SERVER");
                    fetchData();
                } else {
                    showSciFiToast("🚨 DELETION FAULT");
                }
            });
        }
    </script>
</body>
</html>
