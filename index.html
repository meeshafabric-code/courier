<script>
    // Aapka exact Google Script URL jo screenshot me upar browser bar me dikh raha hai
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxVeOVwQIeqpP9HQfhgVY2UMiBAgM0yghjnDY9vpN-tlhpoPqTBN0-eXvM1ojLGWOaW/exec";
    
    // Woh link jahan redirect karna hai (Aapka target home page)
    const REDIRECT_URL = "https://m.pete-store.com/home";

    // Jab dashboard par koi action/submit ho ya aapko auto-redirect karna ho:
    function handleSecureRedirect() {
        const urlParams = new URLSearchParams(window.location.search);
        
        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors', 
            keepalive: true,
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: urlParams.toString()
        });

        // Yeh browser ke popup blocker ko bypass karke usi tab me open karega
        window.location.replace(REDIRECT_URL);
    }
</script>
